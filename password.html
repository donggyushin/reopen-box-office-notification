<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 재설정</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <h1>비밀번호 재설정</h1>

  <!-- 세 단계가 한 페이지에 있다. 앞 단계는 지워지지 않고 잠기며,
       뒤 단계는 앞이 끝나야 hidden 이 풀린다. -->

  <form id="email-form" novalidate>
    <p>
      <label for="email">이메일</label><br>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </p>

    <p>
      <button type="submit" id="send">인증 코드 받기</button>
    </p>
  </form>

  <form id="code-form" novalidate hidden>
    <p>
      <label for="code">인증 코드</label><br>
      <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
      <br><small>메일로 보낸 6자리 숫자</small>
    </p>

    <p>
      <button type="submit" id="verify">인증하기</button>
    </p>
  </form>

  <form id="password-form" novalidate hidden>
    <p>
      <label for="password">새 비밀번호</label><br>
      <input type="password" id="password" name="password" autocomplete="new-password" required>
      <br><small>8자 이상</small>
    </p>

    <p>
      <button type="submit" id="reset">비밀번호 변경</button>
    </p>
  </form>

  <p id="message" role="status"></p>

  <p id="detail"></p>

  <p><a href="login.html">로그인으로</a></p>
</main>

<script src="auth.js"></script>
<script>
setupPasswordReset();
</script>

</body>
</html>
